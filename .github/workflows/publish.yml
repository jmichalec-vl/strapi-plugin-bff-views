name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # npm provenance attestation
      id-token: write
    steps:
      # A fine-grained PAT (Contents: read/write on this repo): the version
      # commit and tag go to the protected main through the Admin bypass
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # Full quality gate before publishing
      - run: npm run type-check
      - run: npm run lint
      - run: npm test

      # Build and verify the package contents/exports
      - run: npm run build
      - run: npm run verify

      # Guard against accidentally bundling dependencies into the tarball
      - run: npm run size-check

      - name: Bump version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version ${{ github.event.inputs.version }} -m "release: v%s"

      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Push version commit
        run: git push origin main --follow-tags
