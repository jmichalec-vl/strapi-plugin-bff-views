name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A fine-grained PAT (Contents, Pull requests, Issues: read/write): the
      # Release PR, the tag and the GitHub Release go through the Admin bypass
      # of the rulesets, and a PAT-opened PR triggers the CI workflow.
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.GH_PAT }}

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm provenance attestation
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      # Full quality gate before publishing
      - run: npm run type-check
      - run: npm run lint
      - run: npm test

      # Build and verify the package contents/exports
      - run: npm run build
      - run: npm run verify

      # Guard against accidentally bundling dependencies into the tarball
      - run: npm run size-check

      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
